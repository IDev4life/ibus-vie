name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_arch: amd64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact_arch: arm64
            cross: true

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release -p ibus-vie-engine -p ibus-vie-cli --target ${{ matrix.target }}

      - name: Package tar.gz
        env:
          TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.artifact_arch }}
        run: |
          TARGET_DIR=target/${{ matrix.target }}/release
          VERSION=${TAG#v}
          ARCHIVE=ibus-vie-${VERSION}-${ARCH}.tar.gz
          tar -czf "$ARCHIVE" \
            -C "$TARGET_DIR" \
            ibus-vie-engine \
            ibus-vie-cli
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Install cargo-deb
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deb

      - name: Package deb
        run: |
          sed 's|@LIBEXEC@|/usr/libexec|g' data/vie.xml.in > data/vie.xml
          cargo deb -p ibus-vie-engine --no-build --target ${{ matrix.target }}
          DEB=$(find target/${{ matrix.target }}/debian/ -maxdepth 1 -name 'ibus-vie_*.deb')
          [[ -f "$DEB" ]] || { echo "::error::deb not found"; exit 1; }
          echo "DEB=$DEB" >> $GITHUB_ENV

      - name: Upload to release
        env:
          ARCHIVE: ${{ env.ARCHIVE }}
          DEB: ${{ env.DEB }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$ARCHIVE" "$DEB" --clobber

  checksums:
    name: Generate checksums
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download release assets
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "*.tar.gz" --pattern "*.deb" --dir artifacts/

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz *.deb > SHA256SUMS.txt

      - name: Upload checksums
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            artifacts/SHA256SUMS.txt --clobber

  publish-apt:
    name: Publish APT repository
    runs-on: ubuntu-24.04
    needs: checksums
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install reprepro
        run: sudo apt-get install -y reprepro

      - name: Download amd64 .deb from release
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "*amd64.deb" --dir artifacts/

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_ID=$GPG_ID" >> $GITHUB_ENV

      - name: Update apt repository
        run: |
          DEB=$(ls artifacts/*.deb)
          mkdir -p pages/apt/conf
          cat > pages/apt/conf/distributions << EOF
          Origin: ibus-vie
          Label: ibus-vie
          Codename: stable
          Architectures: amd64
          Components: main
          Description: ibus-vie Vietnamese input method
          SignWith: $GPG_ID
          EOF
          reprepro -b pages/apt includedeb stable "$DEB"
          gpg --armor --export "$GPG_ID" > pages/KEY.gpg

      - name: Commit and push gh-pages
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "apt: add ibus-vie ${{ github.event.release.tag_name }}"
          git push
