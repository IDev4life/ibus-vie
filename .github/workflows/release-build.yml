name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_arch: amd64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact_arch: arm64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --bin ibus-vie-engine --bin ibus-vie-cli --target ${{ matrix.target }}

      - name: Package tar.gz
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TARGET_DIR=target/${{ matrix.target }}/release
          VERSION=${TAG#v}
          ARCHIVE=ibus-vie-${VERSION}-${{ matrix.artifact_arch }}.tar.gz
          tar -czf "$ARCHIVE" \
            -C "$TARGET_DIR" \
            ibus-vie-engine \
            ibus-vie-cli
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Install cargo-deb
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deb

      - name: Package deb
        run: |
          sed 's|@LIBEXEC@|/usr/libexec|g' data/vie.xml.in > data/vie.xml
          cargo deb -p ibus-vie-engine --no-build --target ${{ matrix.target }}
          DEB=$(find target/${{ matrix.target }}/debian/ -name 'ibus-vie_*.deb' | sort -r | head -1)
          [[ -f "$DEB" ]] || { echo "::error::deb not found"; exit 1; }
          echo "DEB=$DEB" >> $GITHUB_ENV

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.ARCHIVE }}" "${{ env.DEB }}" --clobber

  checksums:
    name: Generate checksums
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "*.tar.gz" --pattern "*.deb" --dir artifacts/

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz *.deb > SHA256SUMS.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            artifacts/SHA256SUMS.txt --clobber
