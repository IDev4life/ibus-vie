name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # Thứ 2 hàng tuần 03:00 UTC

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    uses: IDev4life/.github/.github/workflows/codeql.yml@v1.0.0
    with:
      languages: '["rust"]'
      build_mode: none
