[package]
name = "ibus-vie-engine"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "IBus engine binary for Vietnamese input (ibus-vie)"

[[bin]]
name = "ibus-vie-engine"
path = "src/main.rs"

[package.metadata.deb]
name = "ibus-vie"
maintainer = "IDev4life <letuanthong350@gmail.com>"
depends = "ibus"
section = "utils"
priority = "optional"
maintainer-scripts = "debian/"
assets = [
  ["target/release/ibus-vie-engine", "usr/libexec/ibus-engine-vie", "755"],
  ["target/release/ibus-vie-cli",    "usr/bin/ibus-vie-cli",         "755"],
  ["data/vie.xml",                   "usr/share/ibus/component/vie.xml", "644"],
]

[dependencies]
ibus-vie-im = { path = "../ibus-vie-im" }
zbus.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
thiserror.workspace = true
